<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Las ocho capas del sistema</title>
<style>
  :root{
    color-scheme:dark;
    --ground:#04070d; --ink:#f2f6ff; --dim:#9fb0cc; --teal:#5fe3c8;
    --serif:"EB Garamond",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(1rem,3vw,2.5rem);gap:1.1rem;
  }
  .vineta{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.75) 100%);
  }
  header{text-align:center;z-index:1}
  h1{
    font-family:var(--serif);font-weight:700;letter-spacing:-.02em;margin:0;
    font-size:clamp(1.3rem,2.6vw,2.1rem);
  }
  header p{
    margin:.35rem 0 0;color:var(--dim);font-size:clamp(.78rem,1.1vw,.92rem);
    letter-spacing:.16em;text-transform:uppercase;
  }
  .marco{
    position:relative;z-index:1;width:min(1280px,100%);
    border-radius:14px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(95,227,200,.14);
    background:#000;
  }
  video{display:block;width:100%;height:auto}
  .rep{
    position:absolute;inset:0;display:none;place-items:center;
    background:rgba(4,7,13,.72);cursor:pointer;backdrop-filter:blur(3px);
  }
  .rep.on{display:grid}
  .rep span{
    font-family:var(--sans);font-size:1rem;letter-spacing:.12em;text-transform:uppercase;
    border:1px solid rgba(95,227,200,.5);color:var(--teal);
    padding:.85rem 1.6rem;border-radius:999px;background:rgba(95,227,200,.08);
  }
  footer{
    z-index:1;display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;
    color:#6b7a92;font-size:.78rem;letter-spacing:.06em;
  }
  footer a{color:#6b7a92;text-decoration:none;border-bottom:1px solid #2a3547;padding-bottom:1px}
  footer a:hover{color:var(--teal);border-color:var(--teal)}
</style>
</head>
<body>
<div class="vineta"></div>

<header>
  <h1>Las ocho capas del sistema</h1>
  <p>Jennas · noviembre 2026</p>
</header>

<div class="marco">
  <video id="v" src="capas.mp4" poster="poster.jpg"
         autoplay muted playsinline controls preload="auto"></video>
  <div class="rep" id="rep"><span>Ver de nuevo</span></div>
</div>

<footer>
  <span>52 s · sin sonido</span>
  <a href="diapositivas/">ver como diapositivas</a>
  <a href="capas.mp4" download>descargar</a>
</footer>

<script>
  var v = document.getElementById('v'), rep = document.getElementById('rep');
  v.addEventListener('ended', function(){ rep.classList.add('on'); });
  rep.addEventListener('click', function(){
    rep.classList.remove('on'); v.currentTime = 0; v.play();
  });
</script>
</body>
</html>
